name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-memory-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version and extract release notes
        id: metadata
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, tomllib
          root = pathlib.Path('.')
          version = json.loads((root / 'package.json').read_text())['version']
          lock = json.loads((root / 'package-lock.json').read_text())
          hub = tomllib.loads((root / 'pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Expected a stable semver version'
          assert version == lock['version'] == lock['packages']['']['version'] == hub, 'Version files disagree'
          changelog = (root / 'CHANGELOG.md').read_text()
          sections = re.findall(r'^## \[' + re.escape(version) + r'\] - \d{4}-\d{2}-\d{2}\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          assert len(sections) == 1 and sections[0].strip(), 'Expected one nonempty release-notes section'
          notes_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'local-memory-release-notes.md'
          notes_path.write_text(sections[0].strip() + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=v{version}\nnotes={notes_path}\n')
          print(f'Validated v{version}')
          PY
      - name: Publish the selected main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          TAG: ${{ steps.metadata.outputs.tag }}
          NOTES_FILE: ${{ steps.metadata.outputs.notes }}
        run: |
          set -euo pipefail
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$RELEASE_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published."
          else
            gh release create "$TAG" --target "$RELEASE_SHA" \
              --title "Local Memory $TAG" --notes-file "$NOTES_FILE"
          fi
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$RELEASE_SHA"
          gh release view "$TAG" --json url --jq .url
