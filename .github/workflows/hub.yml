name: Hub CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hub:
    name: hub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.7"
          enable-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: natejswenson/local-fitness
          ref: 544231bd0b03116bc812e2b7e61342e2f45b7d90
          path: .runtime/fitness-source
          persist-credentials: false
      - run: |
          uv sync --locked
      - name: Synthetic hub and fitness contracts
        env:
          FITNESS_SOURCE_REPO: ${{ github.workspace }}/.runtime/fitness-source
        run: |
          .venv/bin/python -m unittest discover -s tests/hub -v
